[package]
name = "prdb-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
prdb-engine = { path = "../engine" }

[[bin]]
name = "client_decoders"
path = "fuzz_targets/client_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_sequence_state"
path = "fuzz_targets/client_sequence_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_ddl_codecs"
path = "fuzz_targets/catalog_ddl_codecs.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
