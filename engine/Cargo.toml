[package]
name = "prdb-engine"
version = "0.1.0"
edition = "2024"
publish = false

[features]
protocol-fuzzing = []

[dependencies]
redb = "=4.4.0"
redb_v2 = { package = "redb", version = "=2.6.4" }
getrandom = "=0.4.3"
libc = "=0.2.191"
sha2 = "=0.11.1"
zeroize = "=1.9.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
